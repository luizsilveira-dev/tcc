<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Budget Marketplace</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            padding: 20px; 
            text-align: center; 
        }

        h1, h2 { color: #7ee787; }

        .hidden { display: none; }

        /* ===== Login ===== */
        .login-container {
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 40px; 
            max-width: 400px; 
            margin: 100px auto;
        }
        .login-container button {
            background: #238636; 
            border: none; 
            color: white; 
            padding: 15px 25px; 
            border-radius: 6px; 
            font-size: 1.1em; 
            margin: 10px; 
            cursor: pointer;
            transition: 0.3s;
        }
        .login-container button:hover {
            background: #2ea043;
        }

        /* ===== Marketplace ===== */
        .budget-control { 
            background: #161b22; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #30363d;
            margin-bottom: 30px; 
            display: inline-block;
        }

        input[type="number"] {
            padding: 10px; 
            font-size: 1.2em; 
            border-radius: 6px; 
            border: 1px solid #30363d;
            background: #0d1117; 
            color: #fff; 
            width: 150px; 
            text-align: center;
        }

        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            padding: 20px; 
            width: 280px; 
            text-align: left; 
            position: relative; 
            transition: 0.3s;
        }
        .card.disabled { opacity: 0.5; border-color: #f85149; }
        .card.disabled h3 { color: #f85149; }

        .price-tag { font-size: 1.4em; color: #7ee787; font-weight: bold; margin: 10px 0; display: block;}
        .price-tag.preco-dinamico { color: #a855f7; }
        .min-cost { font-size: 0.8em; color: #8b949e; }

        button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-buy { background: #238636; color: white; }
        .btn-buy:hover { background: #2ea043; }
        .btn-buy:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        /* ===== Header ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background: #f85149; border: none; color: white;
            padding: 8px 16px; border-radius: 6px; cursor: pointer;
        }
        .logout-btn:hover { background: #da3633; }

        /* ===== Modal de Edição ===== */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            text-align: left;
        }
        .modal h2 { margin: 0 0 20px; color: #7ee787; font-size: 1.2em; }
        .modal label { display: block; font-size: 0.85em; color: #8b949e; margin-bottom: 4px; margin-top: 14px; }
        .modal input, .modal textarea {
            width: 100%; box-sizing: border-box;
            padding: 9px 12px; border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117; color: #fff;
            font-size: 0.95em;
        }
        .modal input:focus, .modal textarea:focus {
            outline: none; border-color: #58a6ff;
        }
        .modal .field-error {
            font-size: 0.78em; color: #f85149; margin-top: 3px; display: none;
        }
        .modal .field-error.visible { display: block; }
        .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .modal-actions button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.95em; }
        .btn-cancelar { background: #30363d; color: #c9d1d9; }
        .btn-cancelar:hover { background: #3d444b; }
        .btn-salvar { background: #238636; color: white; }
        .btn-salvar:hover { background: #2ea043; }
    </style>
</head>
<body>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="login-screen" class="login-container">
        <h2>Escolha seu tipo de login</h2>
        <button onclick="login('cliente')">Entrar como Cliente</button>
        <button onclick="login('vendedor')">Entrar como Vendedor</button>
    </div>

    <!-- ===== TELA PRINCIPAL ===== -->
    <div id="main-screen" class="hidden">
        <div class="header">
            <h1>Marketplace IA</h1>
            <div>
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>
        </div>
        
        <div id="orcamento-panel" class="budget-control">
            <label>Meu Orçamento Disponível (R$): </label>
            <input type="number" id="input-orcamento" value="1500" oninput="carregar()" step="100">
        </div>
        <!-- Painel do vendedor (acima do grid) -->
        <div id="painel-vendedor" style="display:none; margin-bottom:20px;">
            <button class="btn-buy" style="width:auto; background:#2ea043" onclick="adicionarAgente()">+ Adicionar Agente</button>
        </div>
        <div id="app" class="grid"></div>
    </div>

    <!-- ===== MODAL DE EDIÇÃO ===== -->
    <div id="modal-editar" class="modal-overlay">
        <div class="modal">
            <h2>Editar Agente</h2>

            <label for="edit-nome">Nome</label>
            <input type="text" id="edit-nome" maxlength="100" placeholder="Nome do agente">
            <div class="field-error" id="err-nome">O nome não pode estar vazio.</div>

            <label for="edit-tipo">Tipo</label>
            <input type="text" id="edit-tipo" maxlength="60" placeholder="Ex: DevOps, Imagem...">
            <div class="field-error" id="err-tipo">O tipo não pode estar vazio.</div>

            <label for="edit-utilidade">Utilidade Marginal (R$)</label>
            <input type="number" id="edit-utilidade" min="0.01" step="0.01" placeholder="0.00">
            <div class="field-error" id="err-utilidade">Informe um valor maior que zero.</div>

            <label for="edit-custo">Custo de Produção (R$)</label>
            <input type="number" id="edit-custo" min="0.01" step="0.01" placeholder="0.00">
            <div class="field-error" id="err-custo">Informe um valor maior que zero.</div>
            <div class="field-error" id="err-custo-utilidade">O custo não pode ser maior que a utilidade marginal.</div>

            <label for="edit-descricao">Descrição</label>
            <textarea id="edit-descricao" rows="3" maxlength="300" placeholder="Descrição do agente"></textarea>

            <div class="modal-actions">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarEdicao()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- substitua o <script> do seu index.html pelo abaixo -->
<script>
    const API = 'http://localhost:3000/api/agentes';
    let _ultimosAgentes = [];

    // ======== LOGIN / LOGOUT ========
    function login(tipo) {
        sessionStorage.setItem('usuario', tipo);
        mostrarMarketplace();
    }

    function logout() {
        sessionStorage.removeItem('usuario');
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    function mostrarMarketplace() {
        const tipo = sessionStorage.getItem('usuario');
        if (!tipo) return;

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');

        // MOSTRAR/OCULTAR painel do vendedor
        const painel = document.getElementById('painel-vendedor');
        painel.style.display = tipo === 'vendedor' ? 'block' : 'none';

        // MOSTRAR/OCULTAR painel de orçamento: se for vendedor, ocultar
        const orcPanel = document.getElementById('orcamento-panel');
        if (orcPanel) orcPanel.style.display = tipo === 'vendedor' ? 'none' : 'inline-block';

        carregar();
    }

    // ======== MARKETPLACE ========
    async function carregar() {
        const valorOrcamento = document.getElementById('input-orcamento') ? document.getElementById('input-orcamento').value : 0;
        try {
            const res = await fetch(`${API}?orcamento=${valorOrcamento}`);
            if (!res.ok) {
                const text = await res.text();
                throw new Error(`Erro ao buscar catálogo: ${res.status} ${res.statusText} — ${text}`);
            }
            const agentes = await res.json();

            const div = document.getElementById('app');
            div.innerHTML = '';

            _ultimosAgentes = agentes;
            const tipo = sessionStorage.getItem('usuario') || 'cliente';

            agentes.forEach(agente => {
                const classeCard = agente.podeComprar ? '' : 'disabled';
                const textoBotao = agente.podeComprar ? 'Comprar' : 'Orçamento Insuficiente';
                const precoAbaixoDoCheio = tipo === 'cliente' && agente.podeComprar && agente.precoVenda < agente.utilidadeMarginal;
                const classePrecо = precoAbaixoDoCheio ? 'price-tag preco-dinamico' : 'price-tag';

                div.innerHTML += `
                    <div class="card ${classeCard}">
                        <h3>${escapeHtml(agente.nome)}</h3>
                        <div class="min-cost">Utilidade: R$ ${agente.utilidadeMarginal}</div>
                        <div class="min-cost">Custo: R$ ${agente.custoProducao}</div>
                        <span class="${classePrecо}">R$ ${Number(agente.precoVenda).toFixed(2)}</span>
                        <p>${escapeHtml(agente.descricao || '')}</p>
                        ${tipo === 'cliente'
                            ? `<button class="btn-buy" onclick="comprar(${agente.id})" ${!agente.podeComprar ? 'disabled' : ''}>${textoBotao}</button>`
                            : `
                            <button class="btn-buy" style="background:#2ea043; width:48%; margin-right:2%;" onclick="editarAgente(${agente.id})">Editar</button>
                            <button class="btn-buy" style="background:#f85149; width:48%;" onclick="removerAgente(${agente.id})">Remover</button>
                            `}
                    </div>
                `;
            });
        } catch (err) {
            console.error(err);
            alert('Erro ao carregar catálogo. Veja console para mais detalhes.');
        }
    }

    async function comprar(id) {
        const valorOrcamento = document.getElementById('input-orcamento') ? document.getElementById('input-orcamento').value : 0;

        try {
            const res = await fetch(`${API}/${id}/comprar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orcamento: parseFloat(valorOrcamento) })
            });

            const json = await safeParseJson(res);
            if (!res.ok) throw new ServerError(res.status, json);

            alert(`✅ ${json.mensagem}\nPreço Pago: R$ ${json.detalhes.preco_final}`);
        } catch (err) {
            handleError(err, 'comprar');
        }
    }

    // ======== FUNÇÕES DO VENDEDOR ========
    async function adicionarAgente() {
        const nome = prompt("Nome do agente:");
        const tipo = prompt("Tipo:");
        const utilidadeMarginal = prompt("Utilidade marginal (R$):");
        const custoProducao = prompt("Custo de produção (R$):");
        const descricao = prompt("Descrição:");

        if (!nome || !tipo || !utilidadeMarginal || !custoProducao) {
            return alert("Todos os campos são obrigatórios.");
        }

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, tipo, utilidadeMarginal, custoProducao, descricao })
            });

            const json = await safeParseJson(res);
            if (!res.ok) throw new ServerError(res.status, json);

            alert(json.mensagem || 'Agente criado com sucesso!');
            carregar();
        } catch (err) {
            handleError(err, 'adicionarAgente');
        }
    }

    let _editandoId = null;

    function editarAgente(id) {
        // Busca dados atuais do agente a partir dos cards já renderizados
        const agentes = _ultimosAgentes || [];
        const agente = agentes.find(a => a.id === id);

        _editandoId = id;

        document.getElementById('edit-nome').value      = agente ? agente.nome : '';
        document.getElementById('edit-tipo').value      = agente ? agente.tipo : '';
        document.getElementById('edit-utilidade').value = agente ? agente.utilidadeMarginal : '';
        document.getElementById('edit-custo').value     = agente ? agente.custoProducao : '';
        document.getElementById('edit-descricao').value = agente ? (agente.descricao || '') : '';

        // limpa erros anteriores
        document.querySelectorAll('.field-error').forEach(el => el.classList.remove('visible'));

        document.getElementById('modal-editar').classList.add('active');
    }

    function fecharModal() {
        document.getElementById('modal-editar').classList.remove('active');
        _editandoId = null;
    }

    function validarModal() {
        let ok = true;

        const nome = document.getElementById('edit-nome').value.trim();
        const tipo = document.getElementById('edit-tipo').value.trim();
        const utilidade = parseFloat(document.getElementById('edit-utilidade').value);
        const custo = parseFloat(document.getElementById('edit-custo').value);

        const mostrar = (id, visivel) =>
            document.getElementById(id).classList.toggle('visible', visivel);

        mostrar('err-nome',             !nome);
        mostrar('err-tipo',             !tipo);
        mostrar('err-utilidade',        !utilidade || utilidade <= 0);
        mostrar('err-custo',            !custo || custo <= 0);
        mostrar('err-custo-utilidade',  custo > 0 && utilidade > 0 && custo > utilidade);

        if (!nome || !tipo || !utilidade || utilidade <= 0 || !custo || custo <= 0 || custo > utilidade) ok = false;

        return ok;
    }

    async function salvarEdicao() {
        if (!validarModal()) return;

        const payload = {
            nome:             document.getElementById('edit-nome').value.trim(),
            tipo:             document.getElementById('edit-tipo').value.trim(),
            utilidadeMarginal: parseFloat(document.getElementById('edit-utilidade').value),
            custoProducao:    parseFloat(document.getElementById('edit-custo').value),
            descricao:        document.getElementById('edit-descricao').value.trim()
        };

        try {
            const res = await fetch(`${API}/${_editandoId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const json = await safeParseJson(res);
            if (!res.ok) throw new ServerError(res.status, json);

            fecharModal();
            carregar();
        } catch (err) {
            handleError(err, 'editarAgente');
        }
    }

    async function removerAgente(id) {
        if (!confirm("Tem certeza que deseja remover este agente?")) return;

        try {
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            const json = await safeParseJson(res);
            if (!res.ok) throw new ServerError(res.status, json);

            alert(json.mensagem || 'Agente removido.');
            carregar();
        } catch (err) {
            handleError(err, 'removerAgente');
        }
    }

    // ======== Helpers ========
    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
    }

    async function safeParseJson(response) {
        const text = await response.text();
        try {
            return JSON.parse(text || '{}');
        } catch {
            return { _raw: text };
        }
    }

    class ServerError extends Error {
        constructor(status, payload) {
            super(`Server returned ${status}`);
            this.status = status;
            this.payload = payload;
        }
    }

    function handleError(err, context = '') {
        console.error(`Erro em ${context}:`, err);
        if (err instanceof ServerError) {
            const p = err.payload || {};
            // tenta extrair mensagem do payload
            const msg = p.mensagem || p.message || JSON.stringify(p);
            alert(`Erro do servidor (${err.status}): ${msg}`);
        } else {
            alert(`Erro: ${err.message || err}`);
        }
    }

    // Fecha modal ao clicar fora dele
    document.getElementById('modal-editar').addEventListener('click', function(e) {
        if (e.target === this) fecharModal();
    });

    // Auto-login se já tiver sessão
    window.onload = mostrarMarketplace;
</script>
</body>
</html>
